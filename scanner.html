<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLICE CYBER LAB 3.0</title>

<style>
body {
    background: #080d16;
    color: #00ff99;
    font-family: monospace;
    text-align: center;
    padding: 20px;
}

.box {
    border: 1px solid #00ff99;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    box-shadow: 0 0 15px #00ff9940;
}

input {
    width: 90%;
    padding: 13px;
    margin: 15px 0;
    border-radius: 7px;
    border: 1px solid #00ff99;
    background: #101a27;
    color: white;
}

button {
    background: #00ff99;
    padding: 13px 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    margin: 8px;
}

pre {
    color: white;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.safe { color: #00ff99; }
.warning { color: orange; }
.danger { color: #ff4444; }

h1 {
    text-shadow: 0 0 12px #00ff99;
}
</style>
</head>

<body>

<h1>POLICE CYBER LAB</h1>
<h3>LINK SECURITY SCANNER 3.1</h3>

<div class="box">

<p>AUTHORIZED SECURITY ANALYSIS</p>

<input
type="text"
id="urlInput"
placeholder="Enter website URL..."
>

<br>

<button onclick="scan()">START SCAN</button>
<button onclick="clearScan()">CLEAR</button>

<pre id="result">Scanner ready...</pre>

<button onclick="copyReport()">COPY REPORT</button>

</div>

<script>

let report = "";

// DOMAIN ANALYSIS
function analyzeDomain(host) {

    const parts = host.split(".");

    const specialSuffixes = [
        "co.uk", "org.uk", "ac.uk",
        "com.au", "net.au", "org.au",
        "co.nz", "com.br", "com.cn",
        "co.jp", "co.in"
    ];

    const lastTwo = parts.slice(-2).join(".");
    const lastThree = parts.slice(-3).join(".");

    let rootDomain;

    if (specialSuffixes.includes(lastTwo) && parts.length >= 3) {
        rootDomain = lastThree;
    } else {
        rootDomain = lastTwo;
    }

    const subdomain = host === rootDomain
        ? "None"
        : host.slice(0, -(rootDomain.length + 1));

    return {
        hostname: host,
        subdomain: subdomain,
        rootDomain: rootDomain
    };
}


// MAIN SCANNER
function scan() {

    const input = document.getElementById("urlInput").value.trim();
    const result = document.getElementById("result");

    if (!input) {
        result.textContent = "PLEASE ENTER A URL!";
        return;
    }

    let url;

    try {

        url = new URL(
            /^https?:\/\//i.test(input)
            ? input
            : "https://" + input
        );

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Invalid protocol");
        }

    } catch {

        result.textContent = "INVALID URL!";
        return;
    }

    let risks = [];
    let score = 0;

    const host = url.hostname.toLowerCase();
    const raw = input.toLowerCase();

    // DOMAIN ANALYSIS
    const domainInfo = analyzeDomain(host);

    // BRAND IMPERSONATION DETECTION
    const trustedBrands = {
        "paypal": "paypal.com",
        "google": "google.com",
        "facebook": "facebook.com",
        "amazon": "amazon.com",
        "microsoft": "microsoft.com",
        "apple": "apple.com"
    };

    for (const [brand, officialDomain] of Object.entries(trustedBrands)) {

        const official =
            host === officialDomain ||
            host.endsWith("." + officialDomain);

        if (host.includes(brand) && !official) {

            risks.push(
                "Possible brand impersonation: " + brand
            );

            score += 25;
        }
    }

    // HTTPS CHECK
    if (url.protocol !== "https:") {
        risks.push("HTTP connection detected.");
        score += 20;
    }

    // CREDENTIAL CHECK
    if (url.username || url.password) {
        risks.push("Embedded credentials detected.");
        score += 25;
    }

    // IDN CHECK
    if (host.startsWith("xn--") || host.includes(".xn--")) {
        risks.push("Internationalized domain detected.");
        score += 20;
    }

    // IP ADDRESS CHECK
    if (/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)) {
        risks.push("IP address used instead of domain.");
        score += 20;
    }

    // SUBDOMAIN CHECK
    if (domainInfo.subdomain !== "None" &&
        domainInfo.subdomain.split(".").length > 3) {

        risks.push("Unusually many subdomains.");
        score += 10;
    }

    // SENSITIVE KEYWORDS CHECK
    if (/login|verify|account|password|secure/.test(host)) {
        risks.push("Sensitive keywords in domain.");
        score += 15;
    }

    // @ CHARACTER CHECK
    if (raw.includes("@")) {
        risks.push("URL contains @ character.");
        score += 15;
    }

    // URL SHORTENER CHECK
    if (/bit\.ly|tinyurl\.com|t\.co|cutt\.ly/i.test(host)) {
        risks.push("URL shortener detected.");
        score += 15;
    }

    // URL LENGTH CHECK
    if (url.href.length > 150) {
        risks.push("Unusually long URL.");
        score += 10;
    }

    score = Math.min(score, 100);

    let status =
        score >= 50 ? "HIGH RISK INDICATORS" :
        score >= 25 ? "CAUTION" :
        "NO BASIC WARNING DETECTED";

    // REPORT
    report =
        "POLICE CYBER LAB 3.2\n" +
        "-------------------------\n" +
        "Hostname: " + domainInfo.hostname + "\n" +
        "Subdomain: " + domainInfo.subdomain + "\n" +
        "Root Domain: " + domainInfo.rootDomain + "\n" +
        "Protocol: " + url.protocol + "\n" +
        "Risk Score: " + score + "/100\n" +
        "Assessment: " + status + "\n\n" +
        "SECURITY FINDINGS:\n" +
        (risks.length ? risks.join("\n") :
        "No basic warning indicators found.") +
        "\n\n" +
        "IMPORTANT:\n" +
        "This is a local heuristic analysis.\n" +
        "It does not confirm whether a website is safe.\n" +
        "No external website was contacted.\n" +
        "No personal information was transmitted.\n" +
        "Root domain detection is an approximation.";

    result.textContent = report;

    result.className =
        score >= 50 ? "danger" :
        score >= 25 ? "warning" :
        "safe";
}


// CLEAR SCAN
function clearScan() {

    document.getElementById("urlInput").value = "";

    const result = document.getElementById("result");

    result.textContent = "Scanner ready...";
    result.className = "";

    report = "";
}


// COPY REPORT
function copyReport() {

    if (!report) {
        alert("Run the scan first.");
        return;
    }

    navigator.clipboard.writeText(report)
    .then(() => alert("Report copied!"))
    .catch(() => alert("Copy manually."));
}

</script>

</body>
    </html>
