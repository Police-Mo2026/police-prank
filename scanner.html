<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLICE CYBER LAB 3.6</title>
<style>
*{box-sizing:border-box}
body{background:#080d16;color:#00ff99;font-family:monospace;text-align:center;padding:20px}
.box{border:1px solid #00ff99;padding:20px;border-radius:12px;margin-top:20px;box-shadow:0 0 15px #00ff9940}
input{width:95%;padding:13px;margin:15px 0;border-radius:7px;border:1px solid #00ff99;background:#101a27;color:white}
button{background:#00ff99;padding:13px 20px;border:0;border-radius:7px;font-weight:bold;margin:8px;cursor:pointer}
button:hover{background:#00cc77}
pre{color:white;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.safe{color:#00ff99}.warning{color:orange}.danger{color:#ff4444}
h1{text-shadow:0 0 12px #00ff99}h3{color:#00ff99}
.footer{color:#718096;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<h1>POLICE CYBER LAB</h1>
<h3>LINK SECURITY SCANNER 3.6</h3>
<div class="box">
<p>AUTHORIZED SECURITY ANALYSIS</p>
<input type="text" id="urlInput" placeholder="Enter website URL..." autocomplete="url">
<br>
<button onclick="scan()">START SCAN</button>
<button onclick="clearScan()">CLEAR</button>
<button onclick="runAutomatedTests()">RUN AUTO TESTS</button>
<button onclick="copyReport()">COPY REPORT</button>
<pre id="result">Scanner ready...</pre>
</div>
<div class="footer">POLICE CYBER LAB | LOCAL HEURISTIC ANALYSIS 3.6</div>
<script>
"use strict";

let report = "";

const trustedBrands = {
  paypal:"paypal.com", google:"google.com", facebook:"facebook.com",
  amazon:"amazon.com", microsoft:"microsoft.com", apple:"apple.com"
};
const suspiciousRedirectParameters = [
  "url","redirect","redirect_url","redirect_uri","next","return",
  "return_url","continue","destination","dest","target","goto","callback"
];
const specialSuffixes = [
  "co.uk","org.uk","ac.uk","com.au","net.au","org.au",
  "co.nz","com.br","com.cn","co.jp","co.in"
];

function analyzeDomain(host) {
  const parts = host.split(".");
  if (parts.length < 2) return {hostname:host,subdomain:"None",rootDomain:host};
  const lastTwo = parts.slice(-2).join(".");
  const lastThree = parts.slice(-3).join(".");
  const rootDomain = specialSuffixes.includes(lastTwo) && parts.length >= 3 ? lastThree : lastTwo;
  return {
    hostname:host,
    subdomain:host === rootDomain ? "None" : host.slice(0,-(rootDomain.length+1)),
    rootDomain
  };
}
function normalizeDomain(value) {
  return value.toLowerCase().replace(/0/g,"o").replace(/1/g,"i")
    .replace(/3/g,"e").replace(/5/g,"s").replace(/-/g,"");
}
function editDistance(a,b) {
  const m = Array.from({length:a.length+1},(_,i)=>i);
  for(let j=1;j<=b.length;j++){
    let prev=m[0]; m[0]=j;
    for(let i=1;i<=a.length;i++){
      const old=m[i];
      m[i]=Math.min(m[i]+1,m[i-1]+1,prev+(a[i-1]===b[j-1]?0:1));
      prev=old;
    }
  }
  return m[a.length];
}
function similarity(a,b) {
  const max=Math.max(a.length,b.length);
  return max===0?100:Math.round((1-editDistance(a,b)/max)*100);
}
function isOfficialBrandDomain(host,domain) {
  return host===domain || host.endsWith("."+domain);
}
function detectLookalikes(host) {
  const findings=[];
  const labels=host.toLowerCase().split(".");
  for(const brand of Object.keys(trustedBrands)){
    if(isOfficialBrandDomain(host,trustedBrands[brand])) continue;
    for(const label of labels){
      if(label.length<4) continue;
      const normalizedLabel=normalizeDomain(label);
      const normalizedBrand=normalizeDomain(brand);
      const score=similarity(label.replace(/-/g,""),brand);
      const normalizedScore=similarity(normalizedLabel,normalizedBrand);
      const containsBrand=normalizedLabel.includes(normalizedBrand)&&normalizedLabel!==normalizedBrand;
      if(normalizedLabel===normalizedBrand || normalizedScore>=75 ||
         (containsBrand && label.length<=brand.length+12)){
        findings.push({brand,label,score});
        break;
      }
    }
  }
  return findings;
}
function getRawHostname(input) {
  let value=String(input).trim();
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value="https://"+value;
  try { return new URL(value).hostname.replace(/^\[|\]$/g,""); }
  catch(e) {
    const match=value.match(/^[a-z][a-z0-9+.-]*:\/\/([^/?#]*)/i);
    if(!match) return "";
    return match[1].split("@").pop().replace(/:\d+$/,"");
  }
}
function detectUnicodeHost(rawInput) {
  let value=String(rawInput).trim();
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value="https://"+value;
  const match=value.match(/^[a-z][a-z0-9+.-]*:\/\/([^/?#]*)/i);
  if(!match) return [];

  // Inspect the original hostname BEFORE URL() converts Unicode domains to Punycode.
  let authority=match[1].split("@").pop();
  let host=authority;
  if(host.startsWith("[")) return []; // IPv6 literal
  const colon=host.lastIndexOf(":");
  if(colon!==-1 && /^\d+$/.test(host.slice(colon+1))) host=host.slice(0,colon);

  return /[^\x00-\x7F]/.test(host)
    ? ["Non-ASCII Unicode characters found in hostname."] : [];
}
function detectPunycode(host) {
  return String(host).toLowerCase().split(".").some(label=>label.startsWith("xn--"));
}
function detectObfuscation(rawInput) {
  const findings=[], raw=String(rawInput), lower=raw.toLowerCase();
  if(/%(?:2f|5c|40|2e|3a)/i.test(lower)) findings.push("Encoded URL delimiter detected.");
  if(raw.includes("\\")) findings.push("Backslash detected in URL.");
  if(/%25(?:2f|5c|40|2e|3a)/i.test(lower)) findings.push("Possible double URL encoding detected.");
  if(/[\u0000-\u001F\u007F]/.test(raw)) findings.push("Control characters detected.");
  const count=(lower.match(/%[0-9a-f]{2}/g)||[]).length;
  if(count>=5) findings.push("Excessive percent encoding detected.");
  return findings;
}
function detectIPAddress(host) {
  const parts=String(host).split(".");
  return parts.length===4 && parts.every(p=>/^\d{1,3}$/.test(p)&&Number(p)>=0&&Number(p)<=255);
}
function detectSuspiciousPort(url) {
  const port=url.port;
  return port && !["80","443","8080","8443"].includes(port)
    ? ["Uncommon destination port: "+port] : [];
}
function detectRedirectParameters(url) {
  const findings=[];
  for(const [key,value] of url.searchParams){
    if(!suspiciousRedirectParameters.includes(key.toLowerCase())) continue;
    let decoded=value;
    try{decoded=decodeURIComponent(value)}catch(e){}
    try{
      const destination=new URL(decoded,url.origin);
      if(destination.hostname && destination.hostname!==url.hostname)
        findings.push("External redirect destination in parameter: "+key);
    }catch(e){
      if(/https?:\/\//i.test(decoded)) findings.push("Possible encoded redirect destination: "+key);
    }
  }
  return [...new Set(findings)];
}
function detectCredentials(url){return Boolean(url.username||url.password);}
function isLongURL(url){return url.href.length>150;}
function calculateRisk(findings){return Math.min(findings.reduce((sum,f)=>sum+(Number(f.points)||0),0),100);}

function scan() {
  const input=document.getElementById("urlInput").value.trim();
  const result=document.getElementById("result");
  if(!input){report="";result.textContent="PLEASE ENTER A URL!";result.className="warning";return;}
  let url;
  try{
    const prepared=/^[a-z][a-z0-9+.-]*:\/\//i.test(input)?input:"https://"+input;
    url=new URL(prepared);
    if(!["http:","https:"].includes(url.protocol)||!url.hostname) throw new Error("Invalid URL");
  }catch(e){report="";result.textContent="INVALID URL!";result.className="danger";return;}

  const host=url.hostname.toLowerCase(), info=analyzeDomain(host), findings=[];
  function addFinding(title,points,category){
    if(!findings.some(f=>f.title===title)) findings.push({title,points,category});
  }
  const lookalikes=detectLookalikes(host);
  lookalikes.forEach(x=>addFinding("Possible brand impersonation: "+x.label+
    " | Brand: "+x.brand+" | Similarity: "+x.score+"%",35,"Brand"));
  detectUnicodeHost(input).forEach(x=>addFinding(x,25,"Unicode"));
  if(detectPunycode(host)) addFinding("Punycode hostname detected.",20,"International Domain");
  detectObfuscation(input).forEach(x=>addFinding(x,15,"Obfuscation"));
  if(url.protocol!=="https:") addFinding("HTTP connection detected.",20,"Protocol");
  if(detectCredentials(url)) addFinding("Embedded URL credentials detected.",25,"Credentials");
  if(detectIPAddress(host)) addFinding("IPv4 address used instead of domain.",20,"IP Address");
  if(host.includes(":")) addFinding("IPv6 address used as hostname.",20,"IP Address");
  if(info.subdomain!=="None"&&info.subdomain.split(".").length>3)
    addFinding("Unusually many subdomains.",10,"Domain");
  if(/login|verify|account|password|secure/i.test(host))
    addFinding("Sensitive keywords in hostname.",15,"Keywords");
  if(/(^|\.)bit\.ly$|(^|\.)tinyurl\.com$|(^|\.)t\.co$|(^|\.)cutt\.ly$/i.test(host))
    addFinding("Known URL shortener detected.",15,"Shortener");
  if(isLongURL(url)) addFinding("Unusually long URL.",10,"Length");
  detectSuspiciousPort(url).forEach(x=>addFinding(x,10,"Port"));
  detectRedirectParameters(url).forEach(x=>addFinding(x,20,"Redirect"));

  const score=calculateRisk(findings);
  const severity=score>=50?"HIGH":score>=25?"MEDIUM":"LOW";
  const status=score>=50?"HIGH RISK INDICATORS":score>=25?"CAUTION":"NO BASIC WARNING DETECTED";
  report="POLICE CYBER LAB 3.6\nADVANCED THREAT DETECTION\n--------------------------------\n"+
    "Hostname: "+host+"\nSubdomain: "+info.subdomain+"\nRoot Domain: "+info.rootDomain+
    "\nProtocol: "+url.protocol+"\nPort: "+(url.port||"Default")+
    "\n\nRISK ANALYSIS:\nRisk Score: "+score+"/100\nSeverity: "+severity+
    "\nAssessment: "+status+"\n\nLOOKALIKE ANALYSIS:\n"+
    (lookalikes.length?lookalikes.map(x=>x.brand+" | "+x.label+" | "+x.score+"%").join("\n"):"No known brand lookalike detected.")+
    "\n\nUNICODE ANALYSIS:\n"+(detectUnicodeHost(input).join("\n")||"No raw Unicode hostname indicator detected.")+
    "\n\nPUNYCODE ANALYSIS:\n"+(detectPunycode(host)?"Punycode hostname detected.":"No Punycode hostname detected.")+
    "\n\nREDIRECT ANALYSIS:\n"+(detectRedirectParameters(url).join("\n")||"No external redirect indicator detected.")+
    "\n\nSECURITY FINDINGS:\n"+(findings.length?findings.map(f=>"["+f.category+"] "+f.title+" (+"+f.points+")").join("\n"):"No basic warning indicators found.")+
    "\n\nLIMITATIONS:\nLocal heuristic analysis only; no external website was contacted.\n"+
    "No personal information was transmitted.\nThis score is not a probability or a guarantee of safety.\n"+
    "Warnings are indicators, not proof of malicious intent.\nPunycode/Unicode and redirect checks can produce false positives.\n"+
    "Port detection does not verify that a service is open.\nRoot-domain parsing uses a limited suffix list.";
  result.textContent=report;
  result.className=score>=50?"danger":score>=25?"warning":"safe";
}

function runAutomatedTests(){
  const tests=[
    ["Official PayPal Domain",()=>detectLookalikes("paypal.com").length===0],
    ["Official Google Subdomain",()=>detectLookalikes("mail.google.com").length===0],
    ["Paypa1 Lookalike Detection",()=>{const f=detectLookalikes("paypa1.com").find(x=>x.brand==="paypal");return !!f&&f.score===83;}],
    ["Hyphen Lookalike Detection",()=>{const f=detectLookalikes("pay-pal.com").find(x=>x.brand==="paypal");return !!f&&f.score===100;}],
    ["Extra Character Detection",()=>{const f=detectLookalikes("paypall.com").find(x=>x.brand==="paypal");return !!f&&f.score===86;}],
    ["Malicious Subdomain Detection",()=>detectLookalikes("paypal.evil.test").length>0],
    ["Normal Domain Check",()=>detectLookalikes("example.com").length===0],
    ["Edit Distance Calculation",()=>editDistance("paypal","paypall")===1],
    ["Similarity Calculation",()=>similarity("paypal","paypall")===86],
    ["Domain Analysis",()=>{const d=analyzeDomain("shop.example.com");return d.rootDomain==="example.com"&&d.subdomain==="shop";}],
    ["Special Domain Suffix",()=>{const d=analyzeDomain("shop.example.co.uk");return d.rootDomain==="example.co.uk"&&d.subdomain==="shop";}],
    ["Unicode Detection",()=>detectUnicodeHost("https://раypal.com").length>0],
    ["Punycode Detection",()=>detectPunycode("xn--example-9d0.com")===true],
    ["URL Obfuscation Detection",()=>detectObfuscation("https://example.com/%2F%2F").length>0],
    ["IPv4 Detection",()=>detectIPAddress("192.168.1.1")===true],
    ["Invalid IPv4 Rejection",()=>detectIPAddress("999.999.999.999")===false],
    ["Credential Detection",()=>detectCredentials(new URL("https://user:pass@example.com"))===true],
    ["External Redirect Detection",()=>detectRedirectParameters(new URL("https://example.com/?redirect=https://evil.com")).length>0],
    ["Suspicious Port Detection",()=>detectSuspiciousPort(new URL("https://example.com:9090")).length>0],
    ["Risk Score Calculation",()=>calculateRisk([{title:"Test",points:20}])===20]
  ];
  let passed=0,failed=0;
  let output="POLICE CYBER LAB 3.6\nAUTOMATED TEST SYSTEM 3.0\n--------------------------------\n\n";
  tests.forEach(([name,fn])=>{
    try{if(fn()){passed++;output+="PASS | "+name+"\n";}else{failed++;output+="FAIL | "+name+"\n";}}
    catch(e){failed++;output+="ERROR | "+name+" | "+e.message+"\n";}
  });
  output+="\n--------------------------------\nTOTAL TESTS: "+tests.length+
    "\nPASSED: "+passed+"\nFAILED: "+failed+
    "\nSTATUS: "+(failed===0?"ALL TESTS PASSED":"CHECK FAILED TESTS");
  report=output;
  const result=document.getElementById("result");
  result.textContent=output;
  result.className=failed===0?"safe":"warning";
}
function clearScan(){
  document.getElementById("urlInput").value="";
  report="";
  const result=document.getElementById("result");
  result.textContent="POLICE CYBER LAB 3.6\nSCANNER READY...";
  result.className="safe";
}
async function copyReport(){
  if(!report){alert("NO REPORT AVAILABLE!");return;}
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText) throw new Error("Clipboard unavailable");
    await navigator.clipboard.writeText(report);
    alert("REPORT COPIED SUCCESSFULLY!");
  }catch(e){
    window.prompt("Copy the report below:",report);
  }
}
</script>
</body>
  </html>
