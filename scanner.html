<script>

// ======================================
// PART 1
// DOMAIN ANALYSIS ENGINE
// ======================================

const trustedBrands = {
    paypal: ["paypal.com"],
    google: ["google.com"],
    facebook: ["facebook.com"],
    amazon: ["amazon.com"],
    microsoft: ["microsoft.com"],
    apple: ["apple.com"]
};

function normalizeDomain(domain) {
    return domain
        .toLowerCase()
        .replace(/^www\./, "")
        .trim()
        .replace(/\.$/, "");
}

function getHostname(input) {
    try {
        let value = input.trim();

        if (!/^https?:\/\//i.test(value)) {
            value = "https://" + value;
        }

        return new URL(value).hostname.toLowerCase();

    } catch {
        return null;
    }
}

// Common multi-level public suffixes.
// This is a limited list, not a complete Public Suffix List.

const commonPublicSuffixes = [
    "co.uk",
    "org.uk",
    "ac.uk",
    "com.au",
    "net.au",
    "org.au",
    "co.nz",
    "com.br",
    "com.cn",
    "com.hk",
    "com.sg",
    "co.in",
    "co.jp",
    "com.mx",
    "com.ar",
    "com.tr",
    "com.sa",
    "com.eg",
    "com.ly"
];

function getRootDomain(hostname) {
    const host = normalizeDomain(hostname);
    const parts = host.split(".");

    if (parts.length <= 2) {
        return host;
    }

    const lastTwo = parts.slice(-2).join(".");

    if (commonPublicSuffixes.includes(lastTwo)) {
        return parts.slice(-3).join(".");
    }

    return lastTwo;
}

function editDistance(a, b) {
    const matrix = [];

    for (let i = 0; i <= a.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= b.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {

            const cost =
                a[i - 1] === b[j - 1] ? 0 : 1;

            matrix[i][j] = Math.min(
                matrix[i - 1][j] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j - 1] + cost
            );
        }
    }

    return matrix[a.length][b.length];
}

function similarity(a, b) {
    if (!a.length && !b.length) return 100;

    const distance = editDistance(a, b);
    const longest = Math.max(a.length, b.length);

    return Math.round(
        (1 - distance / longest) * 100
    );
}

function isOfficialBrandDomain(hostname) {
    const host = normalizeDomain(hostname);

    for (const brand in trustedBrands) {
        for (const officialDomain of trustedBrands[brand]) {

            if (
                host === officialDomain ||
                host.endsWith("." + officialDomain)
            ) {
                return brand;
            }
        }
    }

    return null;
}

function detectLookalikes(hostname) {
    const root = getRootDomain(hostname);
    const findings = [];

    for (const brand in trustedBrands) {
        for (const officialDomain of trustedBrands[brand]) {

            const officialName =
                officialDomain.split(".")[0];

            const candidate =
                root.split(".")[0];

            const score =
                similarity(candidate, officialName);

            if (
                candidate !== officialName &&
                score >= 75
            ) {
                findings.push({
                    brand,
                    candidate,
                    officialName,
                    similarity: score
                });
            }
        }
    }

    return findings;
}

// ======================================
// BRAND IMPERSONATION DETECTION 3.8
// ======================================

function detectBrandImpersonation(hostname) {

    const host = normalizeDomain(hostname);
    const findings = [];

    // Real official domains and their subdomains
    // are not treated as impersonation.

    if (isOfficialBrandDomain(host)) {
        return findings;
    }

    const labels = host.split(".");

    for (const brand in trustedBrands) {

        for (const officialDomain of trustedBrands[brand]) {

            const brandName =
                officialDomain.split(".")[0];

            // Example:
            // paypal.com.fake-site.com

            if (host.includes(officialDomain)) {

                findings.push({
                    brand,
                    reason:
                        "Official domain embedded in fake hostname"
                });

                continue;
            }

            // Example:
            // paypal.security-login.com
            // paypal-login.com
            // secure-paypal.com

            const suspiciousLabels = labels.slice(0, -1);

            const containsBrand = suspiciousLabels.some(label => {

                return (
                    label === brandName ||
                    label.startsWith(brandName + "-") ||
                    label.endsWith("-" + brandName) ||
                    label.includes("-" + brandName + "-")
                );

            });

            if (containsBrand) {

                findings.push({
                    brand,
                    reason:
                        "Brand name used in suspicious hostname"
                });
            }
        }
    }

    return findings;
}

function analyzeDomain(hostname) {

    const officialBrand =
        isOfficialBrandDomain(hostname);

    const lookalikes =
        detectLookalikes(hostname);

    return {
        hostname,
        rootDomain: getRootDomain(hostname),
        officialBrand,
        lookalikes
    };
}

// ======================================
// END OF PART 1
// ======================================
    // ======================================
// PART 2
// URL SECURITY ANALYSIS ENGINE
// ======================================

const suspiciousRedirectParameters = [
    "redirect",
    "redirect_url",
    "return",
    "return_url",
    "next",
    "url",
    "continue"
];

function detectUnicodeHost(hostname) {
    return /[^\x00-\x7F]/.test(hostname);
}

function detectPunycode(hostname) {
    return hostname
        .split(".")
        .some(part => part.startsWith("xn--"));
}

function detectObfuscation(input) {
    return (
        input.includes("%") ||
        input.includes("\\") ||
        input.includes("@@")
    );
}

function detectIPAddress(hostname) {

    const parts = hostname.split(".");

    if (parts.length !== 4) {
        return false;
    }

    return parts.every(part => {

        if (!/^\d{1,3}$/.test(part)) {
            return false;
        }

        const number = Number(part);

        return number >= 0 && number <= 255;
    });
}

function detectSuspiciousPort(urlObject) {
    // ======================================
// VERSION 3.9
// EXTERNAL REDIRECT DETECTION
// ======================================

function detectExternalRedirects(urlObject) {

    const findings = [];

    for (const [key, value] of urlObject.searchParams.entries()) {

        if (
            !suspiciousRedirectParameters.includes(
                key.toLowerCase()
            )
        ) {
            continue;
        }

        try {

            const target = new URL(value, urlObject.origin);

            if (
                (target.protocol === "https:" ||
                 target.protocol === "http:") &&
                target.hostname !== urlObject.hostname
            ) {

                findings.push({
                    parameter: key,
                    destination: target.hostname
                });

            }

        } catch (error) {
            continue;
        }
    }

    return findings;
    }

    const port = urlObject.port;

    if (!port) {
        return false;
    }

    return !["80", "443"].includes(port);
}

function detectRedirectParameters(urlObject) {

    const findings = [];

    for (const key of urlObject.searchParams.keys()) {

        if (
            suspiciousRedirectParameters.includes(
                key.toLowerCase()
            )
        ) {
            findings.push(key);
        }
    }

    return findings;
}

function detectCredentials(urlObject) {

    return Boolean(
        urlObject.username ||
        urlObject.password
    );
}

function isLongURL(input) {
    return input.length > 200;
}

// ======================================
// RISK CALCULATION
// ======================================

function calculateRisk(findings) {

    let score = 0;

    const weights = {

        unicode: 20,
        punycode: 25,
        obfuscation: 15,
        ipAddress: 20,
        suspiciousPort: 10,
        redirect: 15,
        credentials: 25,
        longURL: 10,
        lookalike: 35,
        brandImpersonation: 35,
        insecureProtocol: 15
        externalRedirect: 20,
    };

    for (const finding of findings) {
        score += weights[finding] || 0;
    }

    return Math.min(score, 100);
}

// ======================================
// MAIN URL ANALYSIS
// ======================================

function analyzeURL(input) {

    const findings = [];
    const messages = [];

    let parsedURL;

    try {

        let value = input.trim();

        if (!/^https?:\/\//i.test(value)) {
            value = "https://" + value;
        }

        parsedURL = new URL(value);

        if (
            parsedURL.protocol !== "https:" &&
            parsedURL.protocol !== "http:"
        ) {
            throw new Error("Unsupported protocol");
        }

        if (!parsedURL.hostname) {
            throw new Error("Missing hostname");
        }

    } catch {

        return {
            valid: false,
            error:
                "Invalid URL. Please enter a valid website address."
        };
    }

    const hostname =
        parsedURL.hostname.toLowerCase();

    if (detectUnicodeHost(hostname)) {

        findings.push("unicode");

        messages.push(
            "Unicode characters detected"
        );
    }

    if (detectPunycode(hostname)) {

        findings.push("punycode");

        messages.push(
            "Punycode domain detected"
        );
    }

    if (detectObfuscation(input)) {

        findings.push("obfuscation");

        messages.push(
            "Possible URL obfuscation"
        );
    }

    if (detectIPAddress(hostname)) {

        findings.push("ipAddress");

        messages.push(
            "Website uses an IP address"
        );
    }

    if (detectSuspiciousPort(parsedURL)) {

        findings.push("suspiciousPort");

        messages.push(
            "Unusual network port detected"
        );
    }

    const redirects =
        detectRedirectParameters(parsedURL);

    if (redirects.length > 0) {

        findings.push("redirect");

        messages.push(
            "Redirect parameters: " +
            redirects.join(", ")
        );
    }
const externalRedirects = detectExternalRedirects(parsedURL);

if (externalRedirects.length > 0) {
    findings.push("externalRedirect");

    externalRedirects.forEach(item => {
        messages.push(
            "External redirect destination detected (" +
            item.parameter + "): " + item.destination
        );
    });
    }
    if (detectCredentials(parsedURL)) {

        findings.push("credentials");

        messages.push(
            "Credentials embedded in URL"
        );
    }

    if (isLongURL(input)) {

        findings.push("longURL");

        messages.push(
            "Unusually long URL"
        );
    }

    if (parsedURL.protocol !== "https:") {

        findings.push("insecureProtocol");

        messages.push(
            "HTTPS is not being used"
        );
    }

    // DOMAIN ANALYSIS

    const domainAnalysis =
        analyzeDomain(hostname);

    // BRAND IMPERSONATION ANALYSIS

    const impersonation =
        detectBrandImpersonation(hostname);

    if (impersonation.length > 0) {

        findings.push("brandImpersonation");

        impersonation.forEach(item => {

            messages.push(
                "Possible " + item.brand +
                " brand impersonation: " +
                item.reason
            );

        });
    }

    // LOOKALIKE ANALYSIS

    if (domainAnalysis.lookalikes.length > 0) {

        findings.push("lookalike");

        for (const item of domainAnalysis.lookalikes) {

            messages.push(
                "Possible " + item.brand +
                " lookalike (" +
                item.similarity +
                "% similarity)"
            );
        }
    }

    const riskScore =
        calculateRisk(findings);

    let assessment = "LOW RISK";

    if (riskScore >= 60) {

        assessment = "HIGH RISK";

    } else if (riskScore >= 30) {

        assessment = "CAUTION";
    }

    return {

        valid: true,
        hostname,
        protocol: parsedURL.protocol,

        rootDomain:
            domainAnalysis.rootDomain,

        officialBrand:
            domainAnalysis.officialBrand,

        riskScore,
        assessment,
        findings
    };
}

// ======================================
// END OF PART 2
// ======================================
    // ======================================
// PART 3
// AUTOMATED TEST SYSTEM 5.0
// ======================================

let lastReport = "";

// --------------------------------------
// SECURITY SCAN
// --------------------------------------

function scan() {

    const input =
        document.getElementById("urlInput").value.trim();

    const resultBox =
        document.getElementById("result");

    if (!input) {

        resultBox.textContent =
            "ERROR: Please enter a website URL.";

        return;
    }

    const report = analyzeURL(input);

    if (!report.valid) {

        resultBox.textContent = report.error;

        lastReport = report.error;

        return;
    }

    let output = "";

    output += "POLICE CYBER LAB 3.8\n";
    output += "SECURITY ANALYSIS REPORT\n";
    output += "--------------------------------\n\n";

    output += "Hostname: " +
        report.hostname + "\n";

    output += "Root Domain: " +
        report.rootDomain + "\n";

    output += "Protocol: " +
        report.protocol + "\n";

    output += "Official Brand: " +
        (report.officialBrand || "Not verified") + "\n";

    output += "Risk Score: " +
        report.riskScore + "/100\n";

    output += "Assessment: " +
        report.assessment + "\n\n";

    output += "SECURITY FINDINGS:\n";

    if (report.findings.length === 0) {

        output +=
            "No suspicious indicators detected.\n";

    } else {

        report.findings.forEach((finding, index) => {

            output +=
                (index + 1) + ". " +
                finding + "\n";

        });
    }

    output += "\n--------------------------------\n";
    output += "LOCAL HEURISTIC ANALYSIS\n";
    output += "This result is not a safety guarantee.\n";
    output += "No external website was contacted.\n";

    lastReport = output;

    resultBox.textContent = output;
}

// --------------------------------------
// AUTOMATED TESTS
// --------------------------------------

function runAutomatedTests() {

    const tests = [];

    function test(name, callback) {

        try {

            const passed =
                callback() === true;

            tests.push({
                name,
                passed
            });

        } catch (error) {

            tests.push({
                name,
                passed: false
            });
        }
    }

    // OFFICIAL DOMAINS

    test("Official PayPal Domain", () =>
        isOfficialBrandDomain("paypal.com") === "paypal"
    );

    test("Official Google Domain", () =>
        isOfficialBrandDomain("google.com") === "google"
    );

    test("Official Facebook Domain", () =>
        isOfficialBrandDomain("facebook.com") === "facebook"
    );

    test("Official Amazon Domain", () =>
        isOfficialBrandDomain("amazon.com") === "amazon"
    );

    test("Official Microsoft Domain", () =>
        isOfficialBrandDomain("microsoft.com") === "microsoft"
    );

    test("Official Apple Domain", () =>
        isOfficialBrandDomain("apple.com") === "apple"
    );

    test("Official Brand Subdomain", () =>
        isOfficialBrandDomain("login.paypal.com") === "paypal"
    );

    test("Reject Fake Official Domain", () =>
        isOfficialBrandDomain("paypal-security.com") === null
    );

    // LOOKALIKE TESTS

    test("Paypa1 Lookalike Detection", () =>
        detectLookalikes("paypa1.com").length > 0
    );

    test("Hyphen Lookalike Detection", () =>
        detectLookalikes("pay-pal.com").length > 0
    );

    test("Extra Character Detection", () =>
        detectLookalikes("paypall.com").length > 0
    );

    test("Edit Distance Calculation", () =>
        editDistance("paypal", "paypa1") === 1
    );

    test("Similarity Calculation", () =>
        similarity("paypal", "paypa1") === 83
    );

    test("Domain Analysis", () =>
        analyzeDomain("paypal.com").rootDomain === "paypal.com"
    );

    // BRAND IMPERSONATION TESTS

    test("Embedded PayPal Domain Detection", () =>
        detectBrandImpersonation(
            "paypal.com.fake-site.com"
        ).some(item => item.brand === "paypal")
    );

    test("PayPal Fake Subdomain Detection", () =>
        detectBrandImpersonation(
            "paypal.security-login.com"
        ).some(item => item.brand === "paypal")
    );

    test("Google Fake Subdomain Detection", () =>
        detectBrandImpersonation(
            "google.security-check.com"
        ).some(item => item.brand === "google")
    );

    test("PayPal Hyphen Domain Detection", () =>
        detectBrandImpersonation(
            "paypal-login.com"
        ).some(item => item.brand === "paypal")
    );

    test("Official PayPal Not Flagged", () =>
        detectBrandImpersonation(
            "login.paypal.com"
        ).length === 0
    );

    // URL SECURITY TESTS

    test("Unicode Detection", () =>
        detectUnicodeHost("exämple.com") === true
    );

    test("Punycode Detection", () =>
        detectPunycode("xn--example-ova.com") === true
    );

    test("URL Obfuscation Detection", () =>
        detectObfuscation(
            "https://example.com/%2F"
        ) === true
    );

    test("Valid IPv4 Detection", () =>
        detectIPAddress("192.168.1.1") === true
    );

    test("Invalid IPv4 Rejection", () =>
        detectIPAddress("999.999.1.1") === false
    );

    test("Credential Detection", () =>
        detectCredentials(
            new URL("https://user:pass@example.com")
        ) === true
    );

    test("Redirect Detection", () =>
        detectRedirectParameters(
            new URL(
                "https://example.com/?redirect=https://other.com"
            )
        ).length > 0
    );

    test("Suspicious Port Detection", () =>
        detectSuspiciousPort(
            new URL("https://example.com:8080")
        ) === true
    );

    test("Long URL Detection", () =>
        isLongURL(
            "https://example.com/" + "a".repeat(220)
        ) === true
    );

    test("HTTPS Protocol Detection", () =>
        analyzeURL("https://example.com").findings.length === 0
    );

    test("HTTP Risk Detection", () =>
        analyzeURL("http://example.com").riskScore === 15
    );

    test("Multi-Level Domain Detection", () =>
        getRootDomain("shop.example.co.uk") === "example.co.uk"
    );

    test("Risk Score Limit", () =>
        calculateRisk([
            "unicode",
            "punycode",
            "obfuscation",
            "ipAddress",
            "suspiciousPort",
            "redirect",
            "credentials",
            "longURL",
            "lookalike",
            "brandImpersonation",
            "insecureProtocol"
            "externalRedirect"
        ]) === 100
    );
    // VERSION 3.9 - EXTERNAL REDIRECT TESTS

    test("External Redirect Detection", () =>
        detectExternalRedirects(
            new URL(
                "https://example.com/?redirect=https%3A%2F%2Fevil.test"
            )
        ).length === 1
    );

    test("Internal Redirect Rejection", () =>
        detectExternalRedirects(
            new URL(
                "https://example.com/?redirect=%2Flogin"
            )
        ).length === 0
    );
    // RESULTS

    const passed =
        tests.filter(item => item.passed).length;

    const failed =
        tests.length - passed;

    let output = "";

    output += "POLICE CYBER LAB 3.8\n";
    output += "AUTOMATED TEST SYSTEM 5.0\n";
    output += "--------------------------------\n\n";

    tests.forEach(item => {

        output +=
            (item.passed ? "PASS" : "FAIL") +
            " | " + item.name + "\n";

    });

    output += "\n--------------------------------\n";

    output +=
        "TOTAL TESTS: " + tests.length + "\n";

    output +=
        "PASSED: " + passed + "\n";

    output +=
        "FAILED: " + failed + "\n";

    output += "\nSTATUS: " +
        (failed === 0
            ? "ALL TESTS PASSED"
            : "TESTS FAILED");

    lastReport = output;

    document.getElementById("result").textContent =
        output;
}

// --------------------------------------
// CLEAR
// --------------------------------------

function clearScan() {

    document.getElementById("urlInput").value = "";

    document.getElementById("result").textContent =
        "POLICE CYBER LAB 3.8\n\n" +
        "SYSTEM STATUS: READY\n\n" +
        "Waiting for security analysis...";

    lastReport = "";
}

// --------------------------------------
// COPY REPORT
// --------------------------------------

async function copyReport() {

    const resultBox =
        document.getElementById("result");

    const textToCopy =
        lastReport || resultBox.textContent;

    try {

        await navigator.clipboard.writeText(textToCopy);

        resultBox.textContent +=
            "\n\nREPORT COPIED SUCCESSFULLY.";

    } catch (error) {

        resultBox.textContent +=
            "\n\nCOPY FAILED: Browser clipboard permission unavailable.";
    }
}

// --------------------------------------
// CONNECT BUTTONS
// --------------------------------------

document.getElementById("scanBtn")
    .addEventListener("click", scan);

document.getElementById("clearBtn")
    .addEventListener("click", clearScan);

document.getElementById("testBtn")
