<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLICE CYBER LAB 3.6</title>

<style>
* { box-sizing: border-box; }

body {
    background: #080d16;
    color: #00ff99;
    font-family: monospace;
    text-align: center;
    padding: 20px;
}

.box {
    border: 1px solid #00ff99;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    box-shadow: 0 0 15px #00ff9940;
}

input {
    width: 95%;

}

    cursor: pointer;
}

button:hover { background: #00cc77; }

pre {
    color: white;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.safe { color: #00ff99; }

h1 { text-shadow: 0 0 12px #00ff99; }

<body>

<h1>POLICE CYBER LAB</h1>
<h3>LINK SECURITY SCANNER 3.6</h3>

<div class="box">

<p>AUTHORIZED SECURITY ANALYSIS</p>

<input
type="text"
id="urlInput"
placeholder="Enter website URL..."
>

<br>

<button onclick="scan()">START SCAN</button>
<button onclick="clearScan()">CLEAR</button>
<button onclick="runAutomatedTests()">RUN AUTO TESTS</button>
<button onclick="copyReport()">COPY REPORT</button>

<pre id="result">Scanner ready...</pre>

</div>

<div class="footer">
POLICE CYBER LAB | ADVANCED THREAT DETECTION 3.6
</div>

<script>

// =====================================
// CONFIGURATION
// =====================================

let report = "";

const trustedBrands = {
    paypal: "paypal.com",
    google: "google.com",
    facebook: "facebook.com",
    amazon: "amazon.com",
    microsoft: "microsoft.com",
    apple: "apple.com"
};

const suspiciousRedirectParameters = [
    "url", "redirect", "redirect_url",
    "redirect_uri", "next", "return",
    "return_url", "continue", "destination",
    "dest", "target", "goto", "callback"
];

const specialSuffixes = [
    "co.uk", "org.uk", "ac.uk",
    "com.au", "net.au", "org.au",
    "co.nz", "com.br", "com.cn",
    "co.jp", "co.in"
];

// =====================================
// DOMAIN ANALYSIS
// =====================================

function analyzeDomain(host) {

    const parts = host.split(".");

    if (parts.length < 2) {
        return {
            hostname: host,
            subdomain: "None",
            rootDomain: host
        };
    }

    const lastTwo = parts.slice(-2).join(".");
    const lastThree = parts.slice(-3).join(".");

    let rootDomain = specialSuffixes.includes(lastTwo)
        && parts.length >= 3
        ? lastThree
        : lastTwo;

    const subdomain = host === rootDomain
        ? "None"
        : host.slice(0, -(rootDomain.length + 1));

    return {
        hostname: host,
        subdomain,
        rootDomain
    };
}

// =====================================
// DOMAIN NORMALIZATION
// =====================================

function normalizeDomain(value) {

    return value.toLowerCase()
        .replace(/0/g, "o")
        .replace(/1/g, "i")
        .replace(/3/g, "e")
        .replace(/5/g, "s")
        .replace(/-/g, "");
}

// =====================================
// EDIT DISTANCE
// =====================================

function editDistance(a, b) {

    const matrix = [];

    for (let i = 0; i <= a.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= b.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= a.length; i++) {

        for (let j = 1; j <= b.length; j++) {

            const cost =
                a[i - 1] === b[j - 1] ? 0 : 1;

            matrix[i][j] = Math.min(
                matrix[i - 1][j] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j - 1] + cost
            );
        }
    }

    return matrix[a.length][b.length];
}

// =====================================
// SIMILARITY
// =====================================

function similarity(a, b) {

    const distance = editDistance(a, b);
    const maxLength = Math.max(a.length, b.length);

    if (maxLength === 0) return 100;

    return Math.round(
        (1 - distance / maxLength) * 100
    );
}

// =====================================
// OFFICIAL DOMAIN CHECK
// =====================================

function isOfficialBrandDomain(host, domain) {

    return host === domain ||
        host.endsWith("." + domain);
}

// =====================================
// LOOKALIKE DETECTION
// =====================================

function detectLookalikes(host) {

    const findings = [];
    const labels = host.split(".");

    for (const [brand, officialDomain] of
        Object.entries(trustedBrands)) {

        if (isOfficialBrandDomain(host, officialDomain)) {
            continue;
        }

        for (const label of labels) {

            if (label.length < 4) continue;

            const normalizedLabel =
                normalizeDomain(label);

            const normalizedBrand =
                normalizeDomain(brand);

            const score = similarity(
                label.replace(/-/g, ""),
                brand
            );

            const normalizedScore = similarity(
                normalizedLabel,
                normalizedBrand
            );

            const containsBrand =
                normalizedLabel.includes(normalizedBrand) &&
                normalizedLabel !== normalizedBrand;

            if (
                normalizedLabel === normalizedBrand ||
                normalizedScore >= 75 ||
                (containsBrand && label.length <= brand.length + 12)
            ) {

                findings.push({
                    brand,
                    label,
                    score
                });

                break;
            }
        }
    }

    return findings;
}

// =====================================
// RAW HOSTNAME EXTRACTION
// =====================================

function getRawHostname(input) {

    let value = input.trim();

    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {
        value = "https://" + value;
    }

    const match = value.match(
        /^[a-z][a-z0-9+.-]*:\/\/([^/?#]*)/i
    );

    if (!match) return "";

    let authority = match[1];

    authority = authority.split("@").pop();

    if (authority.startsWith("[")) {
        return authority.slice(
            1,
            authority.indexOf("]")
        );
    }

    return authority.replace(/:\d+$/, "");
}

// =====================================
// UNICODE DETECTION
// =====================================

function detectUnicodeHost(rawInput) {

    const rawHost = getRawHostname(rawInput);

    if (!rawHost) return [];

    if (/[^\x00-\x7F]/.test(rawHost)) {

        return [
            "Non-ASCII Unicode characters found in hostname."
        ];
    }

    return [];
}

// =====================================
// PUNYCODE DETECTION
// =====================================

function detectPunycode(host) {

    return host.split(".").some(
        label => label.startsWith("xn--")
    );
}

// =====================================
// URL OBFUSCATION
// =====================================

function detectObfuscation(rawInput) {

    const findings = [];
    const raw = rawInput.toLowerCase();

    if (/%(?:2f|5c|40|2e|3a)/i.test(raw)) {
        findings.push("Encoded URL delimiter detected.");
    }

    if (rawInput.includes("\\")) {
        findings.push("Backslash detected in URL.");
    }

    if (/%25(?:2f|5c|40|2e|3a)/i.test(raw)) {
        findings.push("Possible double URL encoding detected.");
    }

    if (/[\u0000-\u001F\u007F]/.test(rawInput)) {
        findings.push("Control characters detected.");
    }

    const encodedCount =
        (raw.match(/%[0-9a-f]{2}/g) || []).length;

    if (encodedCount >= 5) {
        findings.push("Excessive percent encoding detected.");
    }

    return findings;
}

// =====================================
// IP ADDRESS DETECTION
// =====================================

function detectIPAddress(host) {

    const parts = host.split(".");

    if (parts.length !== 4) return false;

    return parts.every(part =>
        /^\d{1,3}$/.test(part) &&
        Number(part) >= 0 &&
        Number(part) <= 255
    );
}

// =====================================
// PORT DETECTION
// =====================================

function detectSuspiciousPort(url) {

    const port = url.port;

    if (!port) return [];

    const commonPorts = [
        "80", "443", "8080", "8443"
    ];

    if (!commonPorts.includes(port)) {
        return [
            "Uncommon destination port: " + port
        ];
    }

    return [];
}

// =====================================
// REDIRECT ANALYSIS
// =====================================

function detectRedirectParameters(url) {

    const findings = [];

    for (const [key, value] of url.searchParams) {

        if (!suspiciousRedirectParameters.includes(
            key.toLowerCase()
        )) {
            continue;
        }

        let decodedValue = value;

        try {
            decodedValue = decodeURIComponent(value);
        } catch (error) {}

        try {

            const destination = new URL(
                decodedValue,
                url.origin
            );

            if (
                destination.hostname &&
                destination.hostname !== url.hostname
            ) {

                findings.push(
                    "External redirect destination in parameter: " + key
                );
            }

        } catch (error) {

            if (/https?:\/\//i.test(decodedValue)) {
                findings.push(
                    "Possible encoded redirect destination: " + key
                );
            }
        }
    }

    return [...new Set(findings)];
}

// =====================================
// CREDENTIAL DETECTION
// =====================================

function detectCredentials(url) {

    return Boolean(url.username || url.password);
}

// =====================================
// URL LENGTH
// =====================================

function isLongURL(url) {

    return url.href.length > 150;
}

// =====================================
// RISK ENGINE
// =====================================

function calculateRisk(findings) {

    let score = 0;

    for (const finding of findings) {
        score += finding.points;
    }

    return Math.min(score, 100);
}

// =====================================
// MAIN SCANNER
// =====================================

function scan() {

    const input = document
        .getElementById("urlInput")
        .value.trim();

    const result = document.getElementById("result");

    if (!input) {
        result.textContent = "PLEASE ENTER A URL!";
        result.className = "warning";
        report = "";
        return;
    }

    let url;

    try {

        const preparedInput =
            /^https?:\/\//i.test(input)
                ? input
                : "https://" + input;

        url = new URL(preparedInput);

        if (
            !["http:", "https:"].includes(url.protocol) ||
            !url.hostname
        ) {
            throw new Error("Invalid URL");
        }

    } catch {

        result.textContent = "INVALID URL!";
        result.className = "danger";
        report = "";
        return;
    }

    const host = url.hostname.toLowerCase();
    const domainInfo = analyzeDomain(host);
    const findings = [];

    function addFinding(title, points, category) {

        if (findings.some(f => f.title === title)) return;

        findings.push({
            title,
            points,
            category
        });
    }

    // BRAND ANALYSIS

    const lookalikes = detectLookalikes(host);

    for (const item of lookalikes) {

        addFinding(
            "Possible brand impersonation: " +
            item.label +
            " | Brand: " +
            item.brand +
            " | Similarity: " +
            item.score + "%",
            35,
            "Brand"
        );
    }

    // UNICODE

    const unicodeFindings = detectUnicodeHost(input);

    for (const finding of unicodeFindings) {
        addFinding(finding, 25, "Unicode");
    }

    // PUNYCODE

    if (detectPunycode(host)) {
        addFinding(
            "Punycode hostname detected.",
            20,
            "International Domain"
        );
    }

    // OBFUSCATION

    for (const finding of detectObfuscation(input)) {
        addFinding(finding, 15, "Obfuscation");
    }

    // HTTP

    if (url.protocol !== "https:") {
        addFinding(
            "HTTP connection detected.",
            20,
            "Protocol"
        );
    }

    // CREDENTIALS

    if (detectCredentials(url)) {
        addFinding(
            "Embedded URL credentials detected.",
            25,
            "Credentials"
        );
    }

    // IPV4

    if (detectIPAddress(host)) {
        addFinding(
            "IP address used instead of domain.",
            20,
            "IP Address"
        );
    }

    // IPV6

    if (host.includes(":")) {
        addFinding(
            "IPv6 address used as hostname.",
            20,
            "IP Address"
        );
    }

    // SUBDOMAINS

    if (
        domainInfo.subdomain !== "None" &&
        domainInfo.subdomain.split(".").length > 3
    ) {
        addFinding(
            "Unusually many subdomains.",
            10,
            "Domain"
        );
    }

    // SENSITIVE KEYWORDS

    if (/login|verify|account|password|secure/i.test(host)) {
        addFinding(
            "Sensitive keywords in hostname.",
            15,
            "Keywords"
        );
    }

    // URL SHORTENERS

    if (
        /(^|\.)bit\.ly$|(^|\.)tinyurl\.com$|(^|\.)t\.co$|(^|\.)cutt\.ly$/i.test(host)
    ) {
        addFinding(
            "Known URL shortener detected.",
            15,
            "Shortener"
        );
    }

    // URL LENGTH

    if (isLongURL(url)) {
        addFinding(
            "Unusually long URL.",
            10,
            "Length"
        );
    }

    // PORT

    for (const finding of detectSuspiciousPort(url)) {
        addFinding(finding, 10, "Port");
    }

    // REDIRECTS

    const redirectFindings =
        detectRedirectParameters(url);

    for (const finding of redirectFindings) {
        addFinding(finding, 20, "Redirect");
    }

    // RISK SCORE

    const score = calculateRisk(findings);

    const status =
        score >= 50 ? "HIGH RISK INDICATORS" :
        score >= 25 ? "CAUTION" :
        "NO BASIC WARNING DETECTED";

    const severity =
        score >= 50 ? "HIGH" :
        score >= 25 ? "MEDIUM" :
        "LOW";

    // REPORT

    report =
        "POLICE CYBER LAB 3.6\n" +
        "ADVANCED THREAT DETECTION\n" +
        "--------------------------------\n" +
        "Hostname: " + host + "\n" +
        "Subdomain: " + domainInfo.subdomain + "\n" +
        "Root Domain: " + domainInfo.rootDomain + "\n" +
        "Protocol: " + url.protocol + "\n" +
        "Port: " + (url.port || "Default") + "\n\n" +

        "RISK ANALYSIS:\n" +
        "Risk Score: " + score + "/100\n" +
        "Severity: " + severity + "\n" +
        "Assessment: " + status + "\n\n" +

        "LOOKALIKE ANALYSIS:\n" +
        (lookalikes.length
            ? lookalikes.map(item =>
                item.brand + " | " +
                item.label + " | " +
                item.score + "%"
            ).join("\n")
            : "No known brand lookalike detected.") +

        "\n\nUNICODE ANALYSIS:\n" +
        (unicodeFindings.length
            ? unicodeFindings.join("\n")
            : "No raw Unicode hostname indicator detected.") +

        "\n\nPUNYCODE ANALYSIS:\n" +
        (detectPunycode(host)
            ? "Punycode hostname detected."
            : "No Punycode hostname detected.") +

        "\n\nREDIRECT ANALYSIS:\n" +
        (redirectFindings.length
            ? redirectFindings.join("\n")
            : "No external redirect indicator detected.") +

        "\n\nSECURITY FINDINGS:\n" +
        (findings.length
            ? findings.map(f =>
                "[" + f.category + "] " +
                f.title +
                " (+" + f.points + ")"
            ).join("\n")
            : "No basic warning indicators found.") +

        "\n\nIMPORTANT:\n" +
        "Local heuristic analysis only.\n" +
        "No external website was contacted.\n" +
        "No personal information was transmitted.\n" +
        "This scanner cannot guarantee website safety.\n" +
        "A warning indicator is not proof of malicious intent.\n" +
        "Punycode and Unicode detection are indicators only.\n" +
        "Redirect detection does not prove a vulnerability.\n" +
        "Port detection does not verify an open service.\n" +
        "Root domain parsing uses a limited suffix list.";

    result.textContent = report;

    result.className =
        score >= 50 ? "danger" :
        score >= 25 ? "warning" :
        "safe";
}

// =====================================
// AUTOMATED TEST SYSTEM 3.0
// =====================================

function runAutomatedTests() {

    const tests = [

        {
            name: "Official PayPal Domain",
            run: () =>
                detectLookalikes("paypal.com").length === 0
        },

        {
            name: "Official Google Subdomain",
            run: () =>
                detectLookalikes("mail.google.com").length === 0
        },

        {
            name: "Paypa1 Lookalike Detection",
            run: () => {
                const f = detectLookalikes("paypa1.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 83;
            }
        },

        {
            name: "Hyphen Lookalike Detection",
            run: () => {
                const f = detectLookalikes("pay-pal.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 100;
            }
        },

        {
            name: "Extra Character Detection",
            run: () => {
                const f = detectLookalikes("paypall.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 86;
            }
        },

        {
            name: "Malicious Subdomain Detection",
            run: () =>
                detectLookalikes("paypal.evil.test").length > 0
        },

        {
            name: "Normal Domain Check",
            run: () =>
                detectLookalikes("example.com").length === 0
        },

        {
            name: "Edit Distance Calculation",
            run: () =>
                editDistance("paypal", "paypall") === 1
        },

        {
            name: "Similarity Calculation",
            run: () =>
                similarity("paypal", "paypall") === 86
        },

        {
            name: "Domain Analysis",
            run: () => {
                const d = analyzeDomain("shop.example.com");

                return d.rootDomain === "example.com" &&
                    d.subdomain === "shop";
            }
        },

        {
            name: "Special Domain Suffix",
            run: () => {
                const d = analyzeDomain("shop.example.co.uk");

                return d.rootDomain === "example.co.uk" &&
                    d.subdomain === "shop";
            }
        },

        {
            name: "Unicode Detection",
            run: () =>
                detectUnicodeHost("https://раypal.com").length > 0
        },

        {
            name: "Punycode Detection",
            run: () =>
                detectPunycode("xn--example-9d0
                                           run: () =>
                detectPunycode("xn--example-9d0.com") === true
        },

        {
            name: "URL Obfuscation Detection",
            run: () =>
                detectObfuscation("https://example.com/%2F%2F").length > 0
        },

        {
            name: "IPv4 Detection",
            run: () =>
                detectIPAddress("192.168.1.1") === true
        },

        {
            name: "Invalid IPv4 Rejection",
            run: () =>
                detectIPAddress("999.999.999.999") === false
        },

        {
            name: "Credential Detection",
            run: () =>
                detectCredentials(
                    new URL("https://user:pass@example.com")
                ) === true
        },

        {
            name: "External Redirect Detection",
            run: () =>
                detectRedirectParameters(
                    new URL("https://example.com/?redirect=https://evil.com")
                ).length > 0
        },

        {
            name: "Suspicious Port Detection",
            run: () =>
                detectSuspiciousPort(
                    new URL("https://example.com:9090")
                ).length > 0
        },

        {
            name: "Risk Score Calculation",
            run: () =>
                calculateRisk([
                    { title: "Test", points: 20 }
                ]) === 20
        }

    ];

    let passed = 0;
    let failed = 0;

    let testReport =
        "POLICE CYBER LAB 3.6\n" +
        "AUTOMATED TEST SYSTEM 3.0\n" +
        "--------------------------------\n\n";

    tests.forEach(test => {

        try {

            if (test.run()) {

                passed++;

                testReport += "PASS | " + test.name + "\n";

            } else {

                failed++;

                testReport += "FAIL | " + test.name + "\n";
            }

        } catch (error) {

            failed++;

            testReport +=
                "ERROR | " + test.name +
                " | " + error.message + "\n";
        }
    });

    testReport +=
        "\n--------------------------------\n" +
        "TOTAL TESTS: " + tests.length + "\n" +
        "PASSED: " + passed + "\n" +
        "FAILED: " + failed + "\n" +
        "STATUS: " +
        (failed === 0 ? "ALL TESTS PASSED" : "CHECK FAILED TESTS");

    report = testReport;

    const result = document.getElementById("result");

    result.textContent = testReport;

    result.className = failed === 0 ? "safe" : "warning";
}

// =====================================
// CLEAR SCAN
// =====================================

function clearScan() {

    document.getElementById("urlInput").value = "";

    report = "";

    const result = document.getElementById("result");

    result.textContent = "POLICE CYBER LAB 3.6\nSCANNER READY...";

    result.className = "safe";
}

// =====================================
// COPY REPORT
// =====================================

async function copyReport() {

    if (!report) {

        alert("NO REPORT AVAILABLE!");

        return;
    }

    try {

        await navigator.clipboard.writeText(report);

        alert("REPORT COPIED SUCCESSFULLY!");

    } catch (error) {

        alert("COPY FAILED. PLEASE COPY THE REPORT MANUALLY.");
    }
}

</script>
