<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLICE CYBER LAB 3.4</title>

<style>
body {
    background: #080d16;
    color: #00ff99;
    font-family: monospace;
    text-align: center;
    padding: 20px;
}

.box {
    border: 1px solid #00ff99;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    box-shadow: 0 0 15px #00ff9940;
}

input {
    width: 90%;
    padding: 13px;
    margin: 15px 0;
    border-radius: 7px;
    border: 1px solid #00ff99;
    background: #101a27;
    color: white;
    box-sizing: border-box;
}

button {
    background: #00ff99;
    padding: 13px 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    margin: 8px;
    cursor: pointer;
}

pre {
    color: white;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.safe { color: #00ff99; }
.warning { color: orange; }
.danger { color: #ff4444; }

h1 {
    text-shadow: 0 0 12px #00ff99;
}

h3 {
    color: #00ff99;
}
</style>
</head>

<body>

<h1>POLICE CYBER LAB</h1>
<h3>LINK SECURITY SCANNER 3.4</h3>

<div class="box">

<p>AUTHORIZED SECURITY ANALYSIS</p>

<input
type="text"
id="urlInput"
placeholder="Enter website URL..."
>

<br>

<button onclick="scan()">START SCAN</button>
<button onclick="clearScan()">CLEAR</button>

<button onclick="runAutomatedTests()">
RUN AUTO TESTS
</button>

<pre id="result">Scanner ready...</pre>

<button onclick="copyReport()">COPY REPORT</button>

</div>

<script>

let report = "";

const trustedBrands = {
    paypal: "paypal.com",
    google: "google.com",
    facebook: "facebook.com",
    amazon: "amazon.com",
    microsoft: "microsoft.com",
    apple: "apple.com"
};


// DOMAIN ANALYSIS
function analyzeDomain(host) {

    const parts = host.split(".");

    const specialSuffixes = [
        "co.uk", "org.uk", "ac.uk",
        "com.au", "net.au", "org.au",
        "co.nz", "com.br", "com.cn",
        "co.jp", "co.in"
    ];

    const lastTwo = parts.slice(-2).join(".");
    const lastThree = parts.slice(-3).join(".");

    let rootDomain;

    if (specialSuffixes.includes(lastTwo) && parts.length >= 3) {
        rootDomain = lastThree;
    } else {
        rootDomain = lastTwo;
    }

    const subdomain = host === rootDomain
        ? "None"
        : host.slice(0, -(rootDomain.length + 1));

    return {
        hostname: host,
        subdomain: subdomain,
        rootDomain: rootDomain
    };
}


// DOMAIN NORMALIZATION
function normalizeDomain(value) {

    return value.toLowerCase()
        .replace(/0/g, "o")
        .replace(/1/g, "i")
        .replace(/3/g, "e")
        .replace(/5/g, "s")
        .replace(/-/g, "");
}


// EDIT DISTANCE
function editDistance(a, b) {

    let matrix = [];

    for (let i = 0; i <= a.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= b.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= a.length; i++) {

        for (let j = 1; j <= b.length; j++) {

            let cost = a[i - 1] === b[j - 1] ? 0 : 1;

            matrix[i][j] = Math.min(
                matrix[i - 1][j] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j - 1] + cost
            );
        }
    }

    return matrix[a.length][b.length];
}


// SIMILARITY
function similarity(a, b) {

    const distance = editDistance(a, b);

    const maxLength = Math.max(a.length, b.length);

    if (maxLength === 0) return 100;

    return Math.round(
        (1 - distance / maxLength) * 100
    );
}


// LOOKALIKE DETECTION
function detectLookalikes(host) {

    const findings = [];

    const labels = host.split(".");

    for (const [brand, officialDomain] of Object.entries(trustedBrands)) {

        const official =
            host === officialDomain ||
            host.endsWith("." + officialDomain);

        if (official) continue;

        for (const label of labels) {

            if (label.length < 4) continue;

            const normalizedLabel = normalizeDomain(label);

            const normalizedBrand = normalizeDomain(brand);

            const score = similarity(
                normalizedLabel,
                normalizedBrand
            );

            if (
                normalizedLabel === normalizedBrand ||
                score >= 75
            ) {

                findings.push({
                    brand: brand,
                    label: label,
                    score: score
                });

                break;
            }
        }
    }

    return findings;
}


// MAIN SCANNER
function scan() {

    const input = document.getElementById("urlInput").value.trim();

    const result = document.getElementById("result");

    if (!input) {
        result.textContent = "PLEASE ENTER A URL!";
        return;
    }

    let url;

    try {

        url = new URL(
            /^https?:\/\//i.test(input)
            ? input
            : "https://" + input
        );

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Invalid protocol");
        }

    } catch {

        result.textContent = "INVALID URL!";
        return;
    }

    let risks = [];
    let score = 0;

    const host = url.hostname.toLowerCase();

    const raw = input.toLowerCase();

    const domainInfo = analyzeDomain(host);

    // LOOKALIKE DETECTION
    const lookalikes = detectLookalikes(host);

    for (const item of lookalikes) {

        risks.push(
            "POSSIBLE LOOKALIKE DOMAIN: " +
            item.label +
            " | Brand: " +
            item.brand +
            " | Similarity: " +
            item.score + "%"
        );

        score += 35;
    }

    // HTTPS CHECK
    if (url.protocol !== "https:") {

        risks.push("HTTP connection detected.");

        score += 20;
    }

    // CREDENTIAL CHECK
    if (url.username || url.password) {

        risks.push("Embedded credentials detected.");

        score += 25;
    }

    // IDN CHECK
    if (host.includes("xn--")) {

        risks.push("Internationalized domain detected.");

        score += 20;
    }

    // IP ADDRESS CHECK
    if (/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)) {

        risks.push("IP address used instead of domain.");

        score += 20;
    }

    // SUBDOMAIN CHECK
    if (
        domainInfo.subdomain !== "None" &&
        domainInfo.subdomain.split(".").length > 3
    ) {

        risks.push("Unusually many subdomains.");

        score += 10;
    }

    // SENSITIVE KEYWORDS
    if (/login|verify|account|password|secure/.test(host)) {

        risks.push("Sensitive keywords in domain.");

        score += 15;
    }

    // @ CHARACTER CHECK
    if (raw.includes("@")) {

        risks.push("URL contains @ character.");

        score += 15;
    }

    // URL SHORTENER CHECK
    if (/bit\.ly|tinyurl\.com|t\.co|cutt\.ly/i.test(host)) {

        risks.push("URL shortener detected.");

        score += 15;
    }

    // URL LENGTH CHECK
    if (url.href.length > 150) {

        risks.push("Unusually long URL.");

        score += 10;
    }

    score = Math.min(score, 100);

    let status =
        score >= 50 ? "HIGH RISK INDICATORS" :
        score >= 25 ? "CAUTION" :
        "NO BASIC WARNING DETECTED";

    // REPORT
    report =
        "POLICE CYBER LAB 3.4\n" +
        "-------------------------\n" +
        "Hostname: " + domainInfo.hostname + "\n" +
        "Subdomain: " + domainInfo.subdomain + "\n" +
        "Root Domain: " + domainInfo.rootDomain + "\n" +
        "Protocol: " + url.protocol + "\n" +
        "Risk Score: " + score + "/100\n" +
        "Assessment: " + status + "\n\n" +

        "LOOKALIKE DETECTION:\n" +

        (lookalikes.length
        ? lookalikes.map(item =>
            item.brand + " | " +
            item.label + " | " +
            item.score + "% similarity"
          ).join("\n")
        : "No known brand lookalike detected.") +

        "\n\nSECURITY FINDINGS:\n" +

        (risks.length
        ? risks.join("\n")
        : "No basic warning indicators found.") +

        "\n\nIMPORTANT:\n" +
        "This is a local heuristic analysis.\n" +
        "It does not confirm whether a website is safe.\n" +
        "No external website was contacted.\n" +
        "No personal information was transmitted.\n" +
        "Similarity is not proof of malicious intent.\n" +
        "Root domain detection is an approximation.";

    result.textContent = report;

    result.className =
        score >= 50 ? "danger" :
        score >= 25 ? "warning" :
        "safe";
}


// =================================
// AUTOMATED TEST SYSTEM 1.0
// =================================

function runAutomatedTests() {

    const tests = [

        {
            name: "Official PayPal Domain",
            run: () => detectLookalikes("paypal.com").length === 0
        },

        {
            name: "Paypa1 Lookalike Detection",
            run: () => {
                const f = detectLookalikes("paypa1.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 83;
            }
        },

        {
            name: "Hyphen Lookalike Detection",
            run: () => {
                const f = detectLookalikes("pay-pal.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 100;
            }
        },

        {
            name: "Extra Character Detection",
            run: () => {
                const f = detectLookalikes("paypall.com")
                    .find(x => x.brand === "paypal");

                return !!f && f.score === 86;
            }
        },

        {
            name: "Normal Domain Check",
            run: () => detectLookalikes("example.com").length === 0
        },

        {
            name: "Edit Distance Calculation",
            run: () => editDistance("paypal", "paypall") === 1
        },

        {
            name: "Domain Analysis",
            run: () => {
                const d = analyzeDomain("shop.example.com");

                return d.rootDomain === "example.com"
                    && d.subdomain === "shop";
            }
        }

    ];

    let passed = 0;
    let failed = 0;

    const results = [];

    for (const test of tests) {

        try {

            const success = test.run();

            if (success) {
                passed++;
                results.push("PASS | " + test.name);
            } else {
                failed++;
                results.push("FAIL | " + test.name);
            }

        } catch (error) {

            failed++;
            results.push("ERROR | " + test.name);

        }
    }

    report =
        "POLICE CYBER LAB 3.4\n" +
        "AUTOMATED TEST SYSTEM 1.0\n" +
        "-----------------------------\n\n" +
        results.join("\n") +
        "\n\n-----------------------------\n" +
        "TOTAL TESTS: " + tests.length +
        "\nPASSED: " + passed +
        "\nFAILED: " + failed +
        "\n\nSTATUS: " +
        (failed === 0 ? "ALL TESTS PASSED" : "TESTS FAILED");

    const result = document.getElementById("result");

    result.textContent = report;

    result.className = failed === 0 ? "safe" : "danger";
}


// CLEAR SCAN
function clearScan() {

    document.getElementById("urlInput").value = "";

    const result = document.getElementById("result");

    result.textContent = "Scanner ready...";

    result.className = "";

    report = "";
}


// COPY REPORT
function copyReport() {

    if (!report) {
        alert("Run the scan or tests first.");
        return;
    }

    navigator.clipboard.writeText(report)
    .then(() => alert("Report copied!"))
    .catch(() => alert("Copy manually."));
}

</script>

</body>
    </html>
