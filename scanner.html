<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLICE CYBER LAB 3.9.1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080d16;
    color: #00ff99;
    font-family: monospace;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1, h2 {
    text-align: center;
}

h1 {
    font-size: 25px;
}

.subtitle {
    text-align: center;
    color: #8ca5b8;
    margin-bottom: 25px;
}

.panel {
    background: #101a28;
    border: 1px solid #1d7657;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px;
    background: #080d16;
    border: 1px solid #00ff99;
    border-radius: 6px;
    color: white;
    font-size: 15px;
    margin-bottom: 12px;
}

button {
    padding: 12px;
    margin: 4px;
    border: 1px solid #00ff99;
    background: #102b25;
    color: #00ff99;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #164b39;
}

#report {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
    color: #d4ffe9;
    min-height: 100px;
}

.pass {
    color: #00ff99;
}

.fail {
    color: #ff5555;
}

.warning {
    color: #ffcc55;
}

.small {
    color: #8296a9;
    font-size: 12px;
    text-align: center;
}

#testResults {
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.footer {
    text-align: center;
    color: #71869a;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>POLICE CYBER LAB</h1>

<h2>LINK SECURITY SCANNER 3.9.1</h2>

<div class="subtitle">
AUTHORIZED SECURITY ANALYSIS
</div>

<div class="panel">

<input
    type="text"
    id="urlInput"
    placeholder="Enter website URL..."
>

<button onclick="startScan()">START SCAN</button>

<button onclick="clearReport()">CLEAR</button>

<button onclick="runTests()">RUN AUTO TESTS</button>

<button onclick="copyReport()">COPY REPORT</button>

</div>

<div class="panel">

<h2>SCAN REPORT</h2>

<div id="report">
Waiting for scan...
</div>

</div>

<div class="panel">

<h2>AUTOMATED TEST SYSTEM 3.0</h2>

<div id="testResults">
Tests have not started.
</div>

</div>

<div class="footer">
POLICE CYBER LAB — EDUCATIONAL SECURITY TOOL
<br>
LOCAL URL ANALYSIS — NO EXTERNAL SCANNING
</div>

</div>

<script>

/* =================================
   1. CONFIGURATION
================================= */

const VERSION = "3.9.1";

const protectedBrands = {
    paypal: ["paypal.com"],
    google: ["google.com"],
    amazon: ["amazon.com"],
    facebook: ["facebook.com"],
    microsoft: ["microsoft.com"],
    apple: ["apple.com"]
};

const suspiciousRedirectParameters = [
    "redirect",
    "redirect_url",
    "redirect_uri",
    "return",
    "return_url",
    "next",
    "continue",
    "url",
    "target",
    "destination"
];


/* =================================
   2. URL PARSER
================================= */

function parseTargetURL(input) {

    let value = input.trim();

    if (!value) {
        throw new Error("Please enter a URL.");
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    let parsed;

    try {
        parsed = new URL(value);
    } catch (error) {
        throw new Error("Invalid URL format.");
    }

    if (
        parsed.protocol !== "http:" &&
        parsed.protocol !== "https:"
    ) {
        throw new Error("Unsupported protocol.");
    }

    const hostname = parsed.hostname.toLowerCase();

    if (!hostname || !hostname.includes(".")) {
        throw new Error("Invalid hostname.");
    }

    if (
        hostname.includes(" ") ||
        hostname.startsWith(".") ||
        hostname.endsWith(".")
    ) {
        throw new Error("Invalid hostname format.");
    }

    return parsed;
}


/* =================================
   3. DOMAIN ANALYSIS
================================= */

function analyzeDomain(hostname) {

    const labels = hostname.split(".");

    const subdomain =
        labels.length > 2
        ? labels.slice(0, -2).join(".")
        : "None";

    // Approximation only.
    // Public suffix lists are not included.

    const rootDomain =
        labels.length >= 2
        ? labels.slice(-2).join(".")
        : hostname;

    return {
        hostname: hostname,
        subdomain: subdomain,
        rootDomain: rootDomain
    };
}


/* =================================
   4. PUNYCODE DETECTION
================================= */

function detectPunycode(hostname) {

    return hostname
        .split(".")
        .some(label => label.startsWith("xn--"));
}


/* =================================
   5. NORMALIZATION
================================= */

function normalizeDomain(value) {

    return value
        .toLowerCase()
        .replace(/-/g, "")
        .replace(/1/g, "l")
        .replace(/0/g, "o")
        .replace(/3/g, "e")
        .replace(/5/g, "s")
        .replace(/7/g, "t");
}


/* =================================
   6. LEVENSHTEIN DISTANCE
================================= */

function levenshteinDistance(a, b) {

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            const cost =
                b[i - 1] === a[j - 1] ? 0 : 1;

            matrix[i][j] = Math.min(
                matrix[i - 1][j] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j - 1] + cost
            );
        }
    }

    return matrix[b.length][a.length];
}


/* =================================
   7. BRAND PROTECTION ENGINE
================================= */

function detectBrandImpersonation(hostname) {

    const findings = [];

    const labels = hostname.split(".");

    for (const brand in protectedBrands) {

        const officialDomains = protectedBrands[brand];

        const isOfficial = officialDomains.some(domain =>
            hostname === domain ||
            hostname.endsWith("." + domain)
        );

        if (isOfficial) {
            continue;
        }

        for (const label of labels) {

            if (label === brand) {

                findings.push({
                    type: "Brand Impersonation",
                    message:
                        "Brand name '" + brand +
                        "' appears on an unofficial domain."
                });

                break;
            }

            const normalizedLabel =
                normalizeDomain(label);

            const normalizedBrand =
                normalizeDomain(brand);

            const distance = levenshteinDistance(
                normalizedLabel,
                normalizedBrand
            );

            if (
                normalizedLabel === normalizedBrand &&
                label !== brand
            ) {

                findings.push({
                    type: "Lookalike domain",
                    message:
                        "Possible lookalike spelling for '" +
                        brand + "'."
                });

                break;
            }

            if (
                label.length >= 4 &&
                distance > 0 &&
                distance <= 1
            ) {

                findings.push({
                    type: "Lookalike domain",
                    message:
                        "Similar spelling detected for brand '" +
                        brand + "'."
                });

                break;
            }
        }
    }

    return findings;
}


/* =================================
   8. REDIRECT DETECTION
================================= */

function detectExternalRedirects(parsedURL) {

    const findings = [];

    for (const [key, value] of parsedURL.searchParams) {

        if (
            !suspiciousRedirectParameters.includes(
                key.toLowerCase()
            )
        ) {
            continue;
        }

        if (!value) {
            continue;
        }

        try {

            const destination = new URL(
                value,
                parsedURL.origin
            );

            if (destination.origin !== parsedURL.origin) {

                findings.push({
                    type: "External Redirect",
                    message:
                        "Parameter '" + key +
                        "' points to another origin."
                });
            }

        } catch (error) {

            findings.push({
                type: "Suspicious Redirect",
                message:
                    "Could not safely interpret redirect parameter '" +
                    key + "'."
            });
        }
    }

    return findings;
}


/* =================================
   9. CREDENTIAL DETECTION
================================= */

function detectCredentials(parsedURL) {

    if (
        parsedURL.username ||
        parsedURL.password
    ) {

        return [{
            type: "Embedded Credentials",
            message:
                "Username or password embedded in URL."
        }];
    }

    return [];
}


/* =================================
   10. PORT ANALYSIS
================================= */

function detectSuspiciousPort(parsedURL) {

    const port = parsedURL.port;

    if (!port) {
        return [];
    }

    const commonPorts = [
        "80",
        "443",
        "8080",
        "8443"
    ];

    if (!commonPorts.includes(port)) {

        return [{
            type: "Unusual Port",
            message:
                "Non-standard port detected: " + port
        }];
    }

    return [];
}


/* =================================
   11. URL SECURITY ANALYSIS
================================= */

function analyzeURL(parsedURL) {

    const findings = [];

    if (parsedURL.protocol === "http:") {

        findings.push({
            type: "HTTP",
            message:
                "Connection uses HTTP instead of HTTPS."
        });
    }

    findings.push(
        ...detectBrandImpersonation(
            parsedURL.hostname
        )
    );

    findings.push(
        ...detectExternalRedirects(parsedURL)
    );

    findings.push(
        ...detectCredentials(parsedURL)
    );

    findings.push(
        ...detectSuspiciousPort(parsedURL)
    );

    if (detectPunycode(parsedURL.hostname)) {

        findings.push({
            type: "Punycode",
            message:
                "Punycode hostname detected."
        });
    }

    return findings;
}


/* =================================
   12. RISK SCORING ENGINE
================================= */

const riskWeights = {

    "HTTP": 15,

    "Brand Impersonation": 35,

    "Lookalike domain": 35,

    "External Redirect": 25,

    "Suspicious Redirect": 15,

    "Embedded Credentials": 30,

    "Unusual Port": 10,

    "Punycode": 25

};


function calculateRisk(findings) {

    let score = 0;

    const reasons = [];

    const seen = new Set();

    for (const finding of findings) {

        const key =
            finding.type + "|" + finding.message;

        if (seen.has(key)) {
            continue;
        }

        seen.add(key);

        const weight =
            riskWeights[finding.type] || 0;

        score += weight;

        if (weight > 0) {
            reasons.push(finding.type);
        }
    }

    score = Math.min(score, 100);

    let assessment = "LOW";

    if (score >= 60) {
        assessment = "HIGH";
    } else if (score >= 30) {
        assessment = "MEDIUM";
    }

    return {
        score: score,
        assessment: assessment,
        reasons: reasons
    };
}


/* =================================
   13. MAIN SCANNER
================================= */

let lastReport = "";


function startScan() {

    const input =
        document.getElementById("urlInput").value;

    const report =
        document.getElementById("report");

    try {

        const parsedURL =
            parseTargetURL(input);

        const domain =
            analyzeDomain(parsedURL.hostname);

        const findings =
            analyzeURL(parsedURL);

        const risk =
            calculateRisk(findings);

        let output = "";

        output += "POLICE CYBER LAB " + VERSION + "\n";

        output += "LINK SECURITY SCANNER\n";

        output += "--------------------------------\n\n";

        output += "Hostname: " +
            domain.hostname + "\n";

        output += "Subdomain: " +
            domain.subdomain + "\n";

        output += "Root Domain Approximation: " +
            domain.rootDomain + "\n";

        output += "Protocol: " +
            parsedURL.protocol + "\n";

        output += "Port: " +
            (parsedURL.port || "Default") + "\n\n";

        output += "Risk Score: " +
            risk.score + "/100\n";

        output += "Assessment: " +
            risk.assessment + "\n\n";

        output += "SECURITY FINDINGS:\n";

        output += "--------------------------------\n";

        if (findings.length === 0) {

            output +=
                "No configured warning indicators detected.\n";

        } else {

            for (const finding of findings) {

                output +=
                    "[" + finding.type + "] " +
                    finding.message + "\n";
            }
        }

        output += "\n--------------------------------\n";

        output +=
            "IMPORTANT: This is a local heuristic analysis.\n";

        output +=
            "It does not prove that a website is safe or malicious.\n";

        output +=
            "No external website was contacted by this scanner.\n";

        lastReport = output;

        report.textContent = output;

    } catch (error) {

        lastReport = "ERROR: " + error.message;

        report.textContent = lastReport;
    }
}


/* =================================
   14. CLEAR REPORT
================================= */

function clearReport() {

    document.getElementById("urlInput").value = "";

    document.getElementById("report").textContent =
        "Waiting for scan...";

    document.getElementById("testResults").textContent =
        "Tests have not started.";

    lastReport = "";
}


/* =================================
   15. COPY REPORT
================================= */

async function copyReport() {

    const report =
        document.getElementById("report").textContent;

    if (!report || report === "Waiting for scan...") {

        alert("There is no report to copy.");

        return;
    }

    try {

        await navigator.clipboard.writeText(report);

        alert("Report copied successfully.");

    } catch (error) {

        alert(
            "Copy failed. Please select and copy the report manually."
        );
    }
}


/* =================================
   16. AUTOMATED TEST SYSTEM
================================= */

function runTests() {

    const results =
        document.getElementById("testResults");

    const tests = [];

    function addTest(name, condition) {

        tests.push({
            name: name,
            passed: Boolean(condition)
        });
    }


    // Official domains

    addTest(
        "Official PayPal Domain",
        detectBrandImpersonation("paypal.com").length === 0
    );

    addTest(
        "Official Google Subdomain",
        detectBrandImpersonation("mail.google.com").length === 0
    );


    // Lookalike detection

    addTest(
        "Paypa1 Lookalike Detection",
        detectBrandImpersonation("paypa1.com")
            .some(x => x.type === "Lookalike domain")
    );

    addTest(
        "Hyphen Lookalike Detection",
        detectBrandImpersonation("pay-pal.com")
            .some(x => x.type === "Lookalike domain")
    );

    addTest(
        "Extra Character Detection",
        detectBrandImpersonation("paypall.com")
            .some(x => x.type === "Lookalike domain")
    );


    // Brand impersonation

    addTest(
        "Brand Impersonation Detection",
        detectBrandImpersonation(
            "paypal-security-check.example.com"
        ).some(x => x.type === "Brand Impersonation")
    );


    // Normal domain

    addTest(
        "Normal Domain Check",
        detectBrandImpersonation("example.com").length === 0
    );


    // Punycode

    addTest(
        "Punycode Detection",
        detectPunycode("xn--example.com") === true
    );


    // Redirect

    const externalRedirect = new URL(
        "https://example.com/?redirect=https://evil.test"
    );

    addTest(
        "External Redirect Detection",
        detectExternalRedirects(externalRedirect).length > 0
    );

    const internalRedirect = new URL(
        "https://example.com/?redirect=/home"
    );

    addTest(
        "Internal Redirect Check",
        detectExternalRedirects(internalRedirect).length === 0
    );


    // HTTP

    const httpURL = new URL("http://example.com");

    addTest(
        "HTTP Detection",
        analyzeURL(httpURL).some(x => x.type === "HTTP")
    );


    // Credentials

    const credentialURL = new URL(
        "https://user:pass@example.com"
    );

    addTest(
        "Embedded Credentials Detection",
        detectCredentials(credentialURL).length > 0
    );


    // Risk score

    const risk = calculateRisk([
        {
            type: "HTTP",
            message: "HTTP detected"
        }
    ]);

    addTest(
        "Risk Score Calculation",
        risk.score === 15
    );


    // Invalid URL

    let invalidRejected = false;

    try {
        parseTargetURL("not a valid url");
    } catch (error) {
        invalidRejected = true;
    }

    addTest(
        "Invalid URL Rejection",
        invalidRejected
    );


    // Display results

    let passed = 0;

    let failed = 0;

    let output = "";

    for (const test of tests) {

        if (test.passed) {

            passed++;

            output +=
                '<div class="pass">PASS | ' +
                test.name + "</div>";

        } else {

            failed++;

            output +=
                '<div class="fail">FAIL | ' +
                test.name + "</div>";
        }
    }

    output += "<br>";

    output += "TOTAL TESTS: " + tests.length + "<br>";

    output +=
        '<span class="pass">PASSED: ' +
        passed + "</span><br>";

    output +=
        '<span class="fail">FAILED: ' +
        failed + "</span><br><br>";

    if (failed === 0) {

        output +=
            '<h3 class="pass">STATUS: ALL TESTS PASSED</h3>';

    } else {

        output +=
            '<h3 class="fail">STATUS: TESTS FAILED</h3>';
    }

    results.innerHTML = output;
}


/* =================================
   17. STARTUP
================================= */

document.getElementById("urlInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            startScan();
        }

    });

</script>

</body>
